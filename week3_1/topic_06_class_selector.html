<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 06 - Class Selector</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Base card class */
        .card {
            border: 1px solid #334155;
            background-color: #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            max-width: 400px;
        }

        /* Extra modifier classes */
        .featured {
            border-color: #10b981;
            background-color: #064e3b;
        }

        .large {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">Game: Teamfight Tactics (Regular)</div>
    <div class="card featured">Current Goal: TOPIK exam preparation</div>
    <div class="card featured large">Major: Computer Engineering at Gachon</div>
</body>
</html>
