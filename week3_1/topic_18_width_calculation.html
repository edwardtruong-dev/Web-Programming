<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 18 - Box Model Width</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Default content-box */
        .content-box {
            box-sizing: content-box;
            width: 200px;
            padding: 15px;
            border: 4px solid #ef4444;
            background-color: #1e293b;
            margin-bottom: 10px;
        }

        /* Modern border-box */
        .border-box {
            box-sizing: border-box;
            width: 200px;
            padding: 15px;
            border: 4px solid #10b981;
            background-color: #1e293b;
            margin-bottom: 10px;
        }

        span { color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="content-box">content-box</div>
    <span>Total rendered width: 200 + 30 + 8 = <strong>238px</strong></span>

    <div class="border-box" style="margin-top: 20px;">border-box</div>
    <span>Total rendered width: strictly <strong>200px</strong></span>
</body>
</html>
