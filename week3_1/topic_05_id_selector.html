<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 05 - ID Selector</title>
    <style>
        body {
            background-color: #18181b;
            color: #f4f4f5;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Hero banner box */
        #hero-banner {
            background-color: #27272a;
            padding: 30px;
            border-radius: 10px;
            border-left: 6px solid #38bdf8;
        }

        /* Targeting single unique title */
        #student-name {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div id="hero-banner">
        <h1 id="student-name">Truong Phat Thuan</h1>
        <p>Computer Engineering student. This card is styled using unique ID selectors.</p>
    </div>
</body>
</html>
