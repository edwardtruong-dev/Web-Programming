<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 10 - Hex Colors</title>
    <style>
        body {
            background-color: #18181b;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        .swatch {
            padding: 10px 18px;
            margin: 6px;
            display: inline-block;
            border-radius: 6px;
            font-weight: bold;
        }

        /* 6-digit hex */
        .red { background-color: #ef4444; }
        .green { background-color: #10b981; }
        .blue { background-color: #3b82f6; }
        .custom { background-color: #8b5cf6; }

        /* 3-digit shorthand */
        .short-white { background-color: #fff; color: #000; }
        .short-cyan { background-color: #06b6d4; }
    </style>
</head>
<body>
    <h2>Hex Color Codes Demo</h2>
    <div class="swatch red">#ef4444</div>
    <div class="swatch green">#10b981</div>
    <div class="swatch blue">#3b82f6</div>
    <div class="swatch custom">#8b5cf6</div>
    <div class="swatch short-white">#fff (White)</div>
    <div class="swatch short-cyan">#06b6d4 (Cyan)</div>
</body>
</html>
