<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 24 - CSS Comments</title>
    <style>
        /* =========================================
           THUAN'S PORTFOLIO - CSS COMMENTS DEMO
           Author: Truong Phat Thuan
           Major: Computer Engineering
           ========================================= */

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
            /* line-height: 1.2; */ /* Temporarily disabled */
            line-height: 1.6;
        }

        /* Navigation styling block */
        .nav-bar {
            display: flex;
            gap: 16px;
            background-color: #1e293b;
            padding: 12px;
            border-radius: 6px;
        }
        .nav-bar span {
            color: #38bdf8;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .nav-bar span:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h2>CSS Comment Practice</h2>
    <p>Comments are useful to organize code sections and disable rules while debugging.</p>
    <div class="nav-bar">
        <span>Dashboard</span>
        <span>Projects</span>
        <span>About</span>
    </div>
</body>
