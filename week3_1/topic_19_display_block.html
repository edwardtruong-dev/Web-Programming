<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 19 - display: block</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Forcing inline span to behave like a block element */
        .block-span {
            display: block;
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            padding: 10px 14px;
            margin: 8px 0;
            width: 280px;
            border-radius: 6px;
        }

        /* Navigation menu vertical stack */
        nav a {
            display: block;
            background-color: #27272a;
            color: #38bdf8;
            padding: 8px 16px;
            text-decoration: none;
            margin-bottom: 4px;
            width: 60px;
            border-radius: 9999px;
            text-align: center;
        }
        nav a:hover {
            background-color: #38bdf8;
            color: #000;
        }
    </style>
</head>
<body>
    <span class="block-span">Span 1 forced to block</span>
    <span class="block-span">Span 2 starts on a fresh line</span>

    <h3 style="margin-top: 20px;">Quick Nav Links</h3>
    <nav>
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</body>
</html>
