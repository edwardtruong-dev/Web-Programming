<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 20 - display: none</title>
    <style>
        body {
            background-color: #18181b;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        .box {
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            background-color: #27272a;
            max-width: 350px;
        }

        .hidden-none { display: none; }
        .hidden-vis { visibility: hidden; }
    </style>
</head>
<body>
    <div class="box">Box 1: Visible</div>
    <div class="box hidden-none">Box 2: display: none (No space taken)</div>
    <div class="box">Box 3: Directly after Box 1</div>
    <div class="box hidden-vis">Box 4: visibility: hidden (Space is reserved)</div>
    <div class="box">Box 5: Notice the gap above from Box 4</div>
    <!-- Toggle with JavaScript -->
  <button onclick="document.getElementById('msg').style.display = document.getElementById('msg').style.display === 'none' ? 'block' : 'none'">
    click to toggle visibility of the message
  </button>
  <div id="msg" class="box" style="display:none">Nothing haha- just kidding.</div>
</body>
</html>
