<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 12 - font-size Units</title>
    <style>
        html { font-size: 100%; } /* Standard 16px root */

        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: sans-serif;
            padding: 20px;
        }
    
        .size-px { font-size: 14px; font-weight: bold; color: #f87171; }
        .scale-sm { font-size: 0.875rem; color: #a1a1aa; }
        .scale-base { font-size: 1rem; }
        .scale-lg { font-size: 1.25rem; color: #60a5fa; }
        .scale-xl { font-size: 1.75rem; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <p class="scale-xl">Thuan's Web Development Log (1.75rem)</p>
    <p class="scale-lg">Week 3: CSS Introduction (1.25rem)</p>
    <p class="scale-base">Standard paragraph text using 1rem (relative to root font size).</p>
    <p class="scale-sm">Small caption text: 0.875rem keeps the layout clean and accessible.</p>
    <p class="size-px">Fixed size 14px text example.</p>
</body>
</html>
