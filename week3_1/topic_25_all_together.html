<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 25 - Thuan's Profile Card</title>
    <style>
        /* 1. Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 2. Base */
        body {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1rem;
            line-height: 1.7;
            background-color: #090d16;
            color: #cbd5e1;
            padding: 20px;
        }

        /* 3. Layout */
        .container {
            max-width: 650px;
            margin: 40px auto;
        }

        /* 4. Profile Card Component */
        .card {
            background-color: #131d2e;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 36px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #0284c7;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }

        h1 {
            font-size: 1.6rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .role {
            color: #38bdf8;
            font-size: 0.95rem;
        }

        /* 5. Skills Badges */
        .skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .skill-badge {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="profile-header">
                <div class="avatar">T</div>
                <div>
                    <h1>Truong Phat Thuan</h1>
                    <p class="role">Computer Engineering Student | Gachon University</p>
                </div>
            </div>
            <p>Hello! I am studying Web Programming. Today I built this personalized profile card by assembling CSS resets, box model, colors, typography, and flexbox layout.</p>
            <div class="skills">
                <span class="skill-badge">SKILL 1</span>
                <span class="skill-badge">SKILL 2</span>
                <span class="skill-badge">SKILL 3</span>
                <span class="skill-badge">SKILL 4</span>
                <span class="skill-badge">SKILL 5</span>
            </div>
        </div>
    </div>
</body>
</html>
