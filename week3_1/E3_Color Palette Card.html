<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E3: Color Palette Card</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
      background-color: #000000ab;
    }
    .palette {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 24px;
      background-color: #ffffffb4;
      border-radius: 12px;
    }
    .swatch {
      flex: 1;
      height: 90px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95rem;
      gap: 4px;
    }
    .swatch span {
      font-size: 0.75rem;
      font-weight: normal;
      opacity: 0.9;
      text-transform: uppercase;
    }
    /* Brand & Accent Palette */
    .c1 { background-color: #15803d; } /* Gachon Green */
    .c2 { background-color: #0369a1; } /* Seoul Blue */
    .c3 { background-color: #10b981; } /* Emerald */
    .c4 { background-color: #1e293b; } /* Dark Slate */
    .c5 { background-color: #7c3aed; } /* Violet Accent */
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch c1">#15803D<span>Primary</span></div>
    <div class="swatch c2">#0369A1<span>Academic</span></div>
    <div class="swatch c3">#10B981<span>Accent</span></div>
    <div class="swatch c4">#1E293B<span>Neutral</span></div>
    <div class="swatch c5">#7C3AED<span>Highlight</span></div>
  </div>
</body>
</html>
