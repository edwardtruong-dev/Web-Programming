<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 13 - font-weight</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
            font-size: 1.1rem;
        }

        .w300 { font-weight: 300; color: #a1a1aa; }
        .w400 { font-weight: 400; }
        .w600 { font-weight: 600; color: #38bdf8; }
        .w700 { font-weight: 700; color: #4ade80; }
        .w900 { font-weight: 900; }
    </style>
</head>
<body>
    <h2>Font Weight Hierarchy</h2>
    <p class="w300">Weight 300: Light description text</p>
    <p class="w400">Weight 400: Regular body copy</p>
    <p class="w600">Weight 600: SemiBold subheadings</p>
    <p class="w700">Weight 700: Bold titles</p>
    <p class="w900">Weight 900: Heavy emphasis</p>
</body>
</html>
