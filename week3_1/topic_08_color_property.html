<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 08 - CSS color Property</title>
    <style>
        body {
            background-color: #0f172a;
            color: #94a3b8; /* Inherited by default */
            font-family: sans-serif;
            padding: 20px;
        }

        h2 { color: #38bdf8; }

        /* Different color formats */
        .named-color { color: tomato; }
        .hex-color { color: #34d399; }
        .rgb-color { color: rgb(96, 165, 250); }
        .hsl-color { color: hsl(270, 70%, 75%); }
        .white-text { color: #ffffff; }
    </style>
</head>
<body>
    <h2>Text Colors in Dark Mode</h2>
    <p class="named-color">Named color: Tomato red</p>
    <p class="hex-color">Hex code: Emerald green (#34d399)</p>
    <p class="rgb-color">RGB value: rgb(96, 165, 250) light blue</p>
    <p class="hsl-color">HSL value: Soft purple tone</p>
    <p class="white-text">This is bright white text for key highlights.</p>
</body>
</html>
