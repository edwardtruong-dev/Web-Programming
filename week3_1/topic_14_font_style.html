<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 14 - font-style</title>
    <style>
        body {
            background-color: #18181b;
            color: #f4f4f5;
            font-family: sans-serif;
            padding: 20px;
        }

        .normal { font-style: normal; }
        .italic { font-style: italic; }

        blockquote {
            font-style: italic;
            color: #93c5fd;
            border-left: 4px solid #38bdf8;
            padding-left: 14px;
            margin: 15px 0;
        }

        .caption {
            font-style: italic;
            font-size: 0.85rem;
            color: #71717a;
        }
    </style>
</head>
<body>
    <p class="normal">Normal upright text for everyday coding notes.</p>
    <blockquote>"Web development is not just about writing code; it's about solving real-world problems."</blockquote>
    <p class="caption">Note: Styled with CSS font-style italic.</p>
</body>
</html>
