<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 04 - Universal Selector</title>
    <style>
        /* Classic CSS reset by Thuan */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            line-height: 1.6;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }

        h2 {
            color: #60a5fa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>CSS Reset Demo</h2>
    <p>Resetting all margins and padding with the universal selector makes styling much easier for my web project.</p>
</body>
</html>
