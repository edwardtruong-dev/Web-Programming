<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 07 - Type Selector</title>
    <style>
        body {
            background-color: #18181b;
            color: #d4d4d8;
            font-family: sans-serif;
            padding: 25px;
        }

        /* Type selectors applied to standard tags */
        h1 { color: #38bdf8; }
        h2 { color: #a78bfa; font-size: 1.3rem; }
        p { font-size: 1rem; line-height: 1.6; }
        a { color: #34d399; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Specific combination */
        p.lead {
            font-size: 1.15rem;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>My Academic Journey</h1>
    <h2>Gachon International College</h2>
    <p class="lead">I am studying Web Programming this semester.</p>
    <p>Outside of coding classes, I practice Korean language and check out gaming updates on <a href="https://korean-game.modlangs.gatech.edu/">my favorite forums</a>.</p>
</body>
</html>
