<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 11 - RGB and RGBA Colors</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        .box {
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 6px;
        }

        .rgb-pure { background-color: rgb(56, 189, 248); color: #000; font-weight: bold; }
        .rgb-dark { background-color: rgb(30, 41, 59); }

        /* Alpha transparency for glassmorphism / overlays */
        .overlay {
            background-color: rgba(5, 14, 6, 0.445);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass {
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <h2>RGB & RGBA Demo</h2>
    <div class="box rgb-pure">rgb(56, 189, 248) - Sky Blue Accent</div>
    <div class="box rgb-dark">rgb(30, 41, 59) - Slate Container</div>
    <div class="box overlay">rgba(5, 14, 6, 0.445) - Dark Modal Overlay</div>
    <div class="box glass">rgba(56, 189, 248, 0.15) - Modern Glassmorphism Card</div>
</body>
</html>
