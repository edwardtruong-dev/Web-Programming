<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E7: Profile Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #15803d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 auto 16px auto;
    }
    .name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .role-name{
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .role {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .skills-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      background-color: #dcfce7;
      color: #15803d;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">T</div>
    <h2 class="name">TRUONG PHAT THUAN</h2>
    <h3 class="role-name">(EdwardTruong)</h3>
    <p class="role">Computer Engineering Student • Gachon University</p>
    <hr>
    <div class="skills-row">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
      <span class="badge">Box Model</span>
      <span class="badge">Computer Engineering</span>
    </div>
  </div>
</body>
</html>
