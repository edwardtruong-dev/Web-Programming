<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topic 09 - background-color</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
        }

        /* Banner with high contrast */
        .banner {
            background-color: #1e3a8a;
            color: #93c5fd;
            padding: 16px 24px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Notice box */
        .notice {
            background-color: #14532d;
            color: #86efac;
            padding: 14px;
            border-left: 5px solid #22c55e;
            margin-bottom: 15px;
        }

        .dark-surface {
            background-color: #27272a;
            color: #e4e4e7;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            border-left: 4px solid #60a5fa;
        }
    </style>
</head>
<body>
    <div class="banner">Gachon University - Web Programming Week 3</div>
    <div class="notice">High contrast achieved: Accessible light text on dark backgrounds.</div>
    <div class="dark-surface">Surface card component for displaying portfolio stats.</div>
</body>
</html>
