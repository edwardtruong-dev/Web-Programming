<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E6: Flexbox Navigation Bar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      background-color: #f1f5f9;
    }
    .navbar {
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
    }
    .logo {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }
    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s ease;
    }
    .nav-links a:hover {
      color: #10B981;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">EDWARD</div>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#academics">Gachon Univ</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
