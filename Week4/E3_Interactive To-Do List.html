<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:400px;margin:auto">
  <style>
    h2 { color: #15803d; }
    .add-row { display:flex; gap:8px; margin-bottom:14px; }
    input { flex:1; padding:8px 12px; border:2px solid #bbf7d0; border-radius:8px; font-size:15px; }
    button { padding:8px 16px; border:none; border-radius:8px; cursor:pointer; font-size:15px; font-weight:bold; }
    .add-btn { background:#15803d; color:white; }
    #todo-list { list-style:none; padding:0; }
    .todo-item { display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; margin-bottom:6px; background:#ecfdf5;
      border-radius:8px; border:1px solid #bbf7d0; }
    .del-btn { background:#dc2626; color:white; padding:4px 10px; font-size:12px; border-radius:6px; }
    #empty-msg { color:#9ca3af; text-align:center; padding:20px; display:none; }
  </style>

  <h2>Edward's CE Tasks</h2>
  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a new task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>
  <ul id="todo-list"></ul>
  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    // 1. Select elements
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const list = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    // Helper: Hide/Show empty message
    function updateEmpty() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    // 2. addTask function
    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = `<span>${text}</span><button class="del-btn">✕</button>`;
      
      list.appendChild(li);
      input.value = '';
      updateEmpty();
    }

    // 3 & 4. Listeners for adding tasks
    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // 5. Delegation for removing tasks
    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('del-btn')) {
        e.target.closest('li').remove();
        updateEmpty();
      }
    });

    updateEmpty();
  </script>
</body></html>
