<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
  <style>
    h2 { color: #15803d; }
    #search { width:100%; padding:10px 14px; font-size:16px;
      border:2px solid #15803d; border-radius:10px; margin-bottom:14px; outline: none; }
    .student { padding:10px 14px; margin-bottom:6px; background:#ecfdf5;
      border-radius:8px; border:1px solid #bbf7d0; font-size:15px; color:#1e293b; }
    mark { background: #f7df1e; border-radius: 3px; font-weight: bold;}
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>

  <h2>Gachon CE Search</h2>
  <input id="search" type="text" placeholder="Search CE students...">
  <div id="student-list">
    <div class="student" data-name="Truong Phat Thuan">Truong Phat Thuan — Computer Engineering</div>
    <div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div>
    <div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div>
    <div class="student" data-name="Choi Hyunwoo">Choi Hyunwoo — Artificial Intelligence</div>
  </div>
  <p id="no-results">No students found.</p>

  <script>
    // 1. Select elements
    const searchInp = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    // 2. Add 'input' listener
    searchInp.addEventListener('input', (e) => {
      // 3a. Get search term
      const term = e.target.value.toLowerCase();
      let visible = 0;
      
      students.forEach(s => {
        // 3b. Read data-name
        const name = s.dataset.name.toLowerCase();
        
        // 3c. Filter logic
        if (name.includes(term)) {
          s.style.display = '';
          visible++;
          
          // BONUS: Highlight matched text
          if (term) {
            const rx = new RegExp(`(${term})`, 'gi');
            s.innerHTML = s.dataset.name.replace(rx, '<mark>$1</mark>')
              + ' — ' + s.textContent.split('—')[1].trim();
          } else {
            s.textContent = s.dataset.name + ' — '
              + s.textContent.split('—')[1].trim();
          }
        } else {
          s.style.display = 'none';
        }
      });
      
      // 4. Handle Empty state
      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>
</body></html>
