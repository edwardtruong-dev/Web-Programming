<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:24px;display:flex;justify-content:center">
  <style>
    .card {
      padding: 24px; border-radius: 16px; width: 280px;
      background: #ecfdf5; border: 2px solid #bbf7d0;
      text-align: center; transition: all 0.3s;
    }
    .card.dark {
      background: #051a0a; border-color: #15803d;
      color: #dcfce7;
    }
    .avatar {
      width: 70px; height: 70px; border-radius: 50%;
      background: #15803d; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 12px;
    }
    button { 
      padding: 8px 20px; border-radius: 20px; cursor: pointer; 
      border: none; margin-top: 14px; font-weight: bold; 
      background: #1e293b; color: white;
    }
  </style>

  <div id="card" class="card">
    <div class="avatar">👨‍💻</div>
    <h2>TRUONG PHAT THUAN</h2>
    <p>Computer Engineering @ Gachon</p>
    <button id="toggle-btn">🌙 Dark Mode</button>
  </div>

  <script>
    // 1. Select elements
    const card = document.querySelector('#card');
    const btn = document.querySelector('#toggle-btn');

    // 2. Add click listener
    btn.addEventListener('click', () => {
      // 3. Toggle class
      card.classList.toggle('dark');
      
      // 4. Update text based on state
      if (card.classList.contains('dark')) {
        btn.textContent = '☀️ Light Mode';
      } else {
        btn.textContent = '🌙 Dark Mode';
      }
    });
  </script>
</body></html>
