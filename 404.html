<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | TRUONG PHAT THUAN (Edward)</title>
  <style>
    :root {
      --primary: #15803d;
      --accent: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --subtext: #475569;
      --border: #cbd5e1;
      --hero-bg: linear-gradient(135deg, #ecfdf5 0%, #dcfce7 100%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--hero-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box-404 {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(21, 128, 61, 0.12);
    }
    .code {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { color: var(--subtext); margin-bottom: 24px; line-height: 1.6; }
    .home-btn {
      display: inline-block;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .home-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="box-404">
    <div class="code">404</div>
    <h1>Oops! This page does not exist.</h1>
    <p>The URL you requested could not be found on <strong>Truong Phat Thuan (Edward)</strong>'s GitHub Pages portfolio. Check for case-sensitive filenames or return to the homepage.</p>
    <a href="./index.html" class="home-btn">← Back to Portfolio Home</a>
  </main>
</body>
</html>
