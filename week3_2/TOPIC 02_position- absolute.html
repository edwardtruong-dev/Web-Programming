<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      position: relative;        /* creates the anchor for absolute children */
      width: 280px;
      height: 160px;
      background: #ecfdf5;
      border: 2px solid #10b981;
      border-radius: 10px;
      margin: 40px;
      font-family: sans-serif;
    }

    /* Badge anchored to top-right corner of .card */
    .badge {
      position: absolute;
      top: -12px; right: -12px;
      background: #15803d;
      color: white;
      font-size: 11px; font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .card-title {
      padding: 24px;
      font-size: 17px; font-weight: bold;
      color: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">EDWARD CE</span>
    <div class="card-title">Computer Engineering Lab</div>
  </div>
</body>
</html>
