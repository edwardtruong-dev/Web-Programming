<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 20px; }

    /* ::before adds a decorative terminal icon */
    h2::before {
      content: '💻 ';
    }

    /* ::after adds a required asterisk to labels */
    .required::after {
      content: ' *';
      color: #ef4444;
      font-weight: bold;
    }

    /* ::after as a decorative underline bar */
    .underline-title {
      position: relative;
      display: inline-block;
      padding-bottom: 8px;
      color: #15803d;
      font-weight: bold;
    }
    .underline-title::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 3px;
      background: #15803d;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <h2>Edward Truong Engineering Portfolio</h2>
  <p><label class="required">Gachon Student ID</label></p>
  <p class="underline-title">Computer Engineering Core</p>
</body>
</html>
