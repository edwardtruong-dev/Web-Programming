<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  body { padding: 40px; background: #ecfdf5; font-family: 'Segoe UI', sans-serif; }
  .card {
    background: white;
    border: 2px solid #10b981;
    border-radius: 12px;
    padding: 24px;
    width: 260px;
    color: #15803d;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(21, 128, 61, 0.25);
  }
</style>
</head>
<body>
  <div class="card">Hover over Edward's Card!</div>
</body>
</html>
