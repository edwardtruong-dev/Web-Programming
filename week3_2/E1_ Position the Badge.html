<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #10b981;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background: #15803d;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">EDWARD CE</span>
    <p style="padding:16px;color:#15803d;font-weight:bold">Computer Engineering Lab - Gachon</p>
  </div>
</body>
</html>
