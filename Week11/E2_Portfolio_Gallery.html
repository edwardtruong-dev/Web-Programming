<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 11 E2: React Portfolio Gallery - Truong Phat Thuan</title>
  <style>
    :root {
      --primary: #15803d;
      --accent: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --subtext: #475569;
      --border: #cbd5e1;
      --hero-bg: linear-gradient(135deg, #ecfdf5 0%, #dcfce7 100%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    header { background: #1e293b; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    .hero { background: var(--hero-bg); padding: 38px 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .hero h1 { color: var(--primary); font-size: 1.9rem; margin-bottom: 6px; }
    main { max-width: 1020px; margin: 0 auto; padding: 32px 20px 60px; }
    .filter-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .filter-btn { padding: 8px 18px; border-radius: 999px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: 700; cursor: pointer; }
    .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .proj-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
    .proj-card h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 8px; }
    .proj-card p { color: var(--subtext); font-size: 0.92rem; margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag { background: var(--bg); border: 1px solid var(--border); color: var(--primary); padding: 2px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .links { display: flex; gap: 10px; }
    .links a { flex: 1; text-align: center; padding: 8px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.86rem; }
    .gh-link { border: 2px solid var(--primary); color: var(--primary); }
    .demo-link { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    const PROJECTS = [
      { id: "p1", title: "Gachon Student Portal", description: "Accessible WCAG 2.1 AA portfolio with live search, dark mode, and ARIA form validation.", techStack: ["HTML/JS", "CSS"], githubLink: "https://github.com/EdwardTruong-dev", demoLink: "../index.html" },
      { id: "p2", title: "React Portfolio Gallery", description: "Modular React gallery built with FilterBar, ProjectList, and ProjectCard components.", techStack: ["React", "CSS"], githubLink: "https://github.com/EdwardTruong-dev", demoLink: "#top" },
      { id: "p3", title: "Developer Joke Fetcher", description: "Async/await REST API fetcher with spinner states and localStorage favourites.", techStack: ["HTML/JS", "CSS"], githubLink: "https://github.com/EdwardTruong-dev", demoLink: "../index.html#jokes" },
      { id: "p4", title: "Course Schedule API", description: "Node/Express JSON endpoints serving Gachon Computer Engineering course schedules.", techStack: ["Node", "React"], githubLink: "https://github.com/EdwardTruong-dev", demoLink: "../Week9/E2_Pages_Deployment_Lab.html" }
    ];

    function FilterBar({ categories, selected, onSelect }) {
      return (
        <div className="filter-bar" role="group" aria-label="Filter projects by technology">
          {categories.map((cat) => (
            <button key={cat} type="button" className={`filter-btn ${selected === cat ? "active" : ""}`} onClick={() => onSelect(cat)}>
              {cat}
            </button>
          ))}
        </div>
      );
    }

    function ProjectCard({ title, description, techStack, githubLink, demoLink }) {
      return (
        <article className="proj-card">
          <div>
            <h2>{title}</h2>
            <p>{description}</p>
            <div className="tags">
              {techStack.map((t) => <span key={t} className="tag">{t}</span>)}
            </div>
          </div>
          <div className="links">
            <a href={githubLink} target="_blank" rel="noreferrer" className="gh-link">GitHub</a>
            <a href={demoLink} className="demo-link">Live Demo →</a>
          </div>
        </article>
      );
    }

    function ProjectList({ projects }) {
      return (
        <div className="grid">
          {projects.map((p) => (
            <ProjectCard key={p.id} title={p.title} description={p.description} techStack={p.techStack} githubLink={p.githubLink} demoLink={p.demoLink} />
          ))}
        </div>
      );
    }

    function App() {
      const [tech, setTech] = useState("All");
      const filtered = tech === "All" ? PROJECTS : PROJECTS.filter((p) => p.techStack.includes(tech));

      return (
        <>
          <header>
            <strong>EDWARD · Week 11 Homework (E2)</strong>
            <span>portfolio-gallery</span>
          </header>
          <section className="hero">
            <h1>Portfolio Gallery Component (React Props)</h1>
            <p>Truong Phat Thuan (Edward) — App → FilterBar + ProjectList → ProjectCard.</p>
          </section>
          <main>
            <FilterBar categories={["All", "React", "Node", "CSS", "HTML/JS"]} selected={tech} onSelect={setTech} />
            <ProjectList projects={filtered} />
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
