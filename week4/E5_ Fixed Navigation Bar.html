<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; }

  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 36px;
    z-index: 100;
  }

  .nav-logo {
    color: #ffffff;
    font-size: 1.25rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.5px;
  }

  .nav-links {
    display: flex;
    gap: 24px;
  }

  .nav-links a {
    color: #ffffff;
    font-size: 0.95rem;
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: #10b981;
  }

  .content { padding-top: 70px; }
  .section { height: 300px; padding: 40px; font-size: 18px; }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="nav-logo">EDWARD</a>
    <div class="nav-links">
      <a href="#s1">About</a>
      <a href="#s2">Gachon Univ</a>
      <a href="#s3">Skills</a>
    </div>
  </nav>
  <div class="content">
    <div class="section" id="s1" style="background:#ecfdf5">Section 1 — Welcome to Edward's Profile…</div>
    <div class="section" id="s2" style="background:#dcfce7">Section 2 — Gachon Univ Fixed Nav Active!</div>
    <div class="section" id="s3" style="background:#bbf7d0">Section 3 — Contact & Domains</div>
  </div>
</body>
</html>
