<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* :hover — mouse over */
    .btn {
      background: #15803d; color: white; border: none;
      padding: 10px 20px; border-radius: 6px; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-weight: 600;
    }
    .btn:hover  { background: #10b981; transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }

    /* :focus-visible — keyboard focus only */
    input {
      border: 2px solid #94a3b8; border-radius: 6px;
      padding: 8px 12px; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus-visible { border-color: #15803d; box-shadow: 0 0 0 3px #bbf7d0; }

    /* :nth-child — stripe table rows */
    table { border-collapse: collapse; width: 280px; margin-top: 16px; font-family: sans-serif; font-size: 13px; }
    td    { padding: 8px 12px; }
    tr:nth-child(even) { background: #ecfdf5; }
    tr:nth-child(odd)  { background: white; }
    tr:first-child     { background: #15803d; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <button class="btn">Edward Action Button</button><br><br>
  <input type="text" placeholder="Tab here for :focus-visible"><br>
  <table>
    <tr><td>Student</td><td>Grade</td></tr>
    <tr><td>Truong Phat Thuan</td><td>A+</td></tr>
    <tr><td>Kim Jisoo</td><td>A</td></tr>
    <tr><td>Park Min</td><td>B+</td></tr>
    <tr><td>Lee Hyun</td><td>B</td></tr>
    <tr><td>Choi Minho</td><td>C+</td></tr>
  </table>
</body>
</html>
